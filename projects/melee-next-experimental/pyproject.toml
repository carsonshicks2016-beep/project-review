[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "melee-next"
version = "2.0.0"
description = "Independent Melee actor-learner laboratory"
requires-python = ">=3.12,<3.14"
dependencies = ["melee==0.47.3", "torch==2.14.0", "numpy==2.5.3", "fastapi==0.141.1", "uvicorn==0.52.4"]
[project.scripts]
melee-next = "melee_next.cli:main"
[tool.setuptools.package-data]
melee_next = ["web/*"]
[tool.setuptools.packages.find]
include = ["melee_next*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
