<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CRUMPLE — soft-body pursuit sandbox</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
  body { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #e8edf5; }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }

  .panel {
    position: absolute; padding: 10px 14px;
    background: rgba(10, 13, 20, 0.55);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 10px;
    backdrop-filter: blur(8px);
  }

  #speedo { left: 24px; bottom: 24px; min-width: 190px; }
  #speedo .val { font-size: 46px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
  #speedo .unit { font-size: 12px; opacity: .55; margin-left: 6px; }
  #gear { font-size: 12px; opacity: .6; margin-top: 4px; letter-spacing: 2px; }

  #status { right: 24px; top: 24px; min-width: 210px; }
  .row { display: flex; justify-content: space-between; gap: 18px; font-size: 12px; margin: 3px 0; }
  .row b { font-weight: 600; }
  .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 7px; }
  .bar > i { display: block; height: 100%; width: 0%; background: #4ade80; transition: width .12s linear, background .3s; }

  #keys { left: 24px; top: 24px; font-size: 11px; line-height: 1.75; opacity: .72; }
  #keys kbd {
    display: inline-block; min-width: 17px; text-align: center;
    padding: 1px 5px; margin-right: 3px; border-radius: 4px;
    background: rgba(255,255,255,.11); border: 1px solid rgba(255,255,255,.14);
  }

  #flash { position: fixed; inset: 0; background: #ff2d2d; opacity: 0; pointer-events: none; }

  #overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: rgba(8,10,15,.82); backdrop-filter: blur(10px); text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h1 { font-size: 52px; margin: 0 0 6px; letter-spacing: -2px; }
  #overlay p { opacity: .7; margin: 4px 0; font-size: 14px; }
  #overlay .hint { margin-top: 22px; font-size: 13px; opacity: .55; }

  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; background: #0b0d12; z-index: 10; cursor: pointer;
  }
  #boot h1 { font-size: 60px; margin: 0; letter-spacing: -3px; }
  #boot p { opacity: .55; font-size: 13px; margin-top: 10px; }
  #boot .go {
    margin-top: 26px; padding: 12px 30px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); font-size: 14px;
  }
</style>
</head>
<body>
<div id="hud">
  <div class="panel" id="keys">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> drive</div>
    <div><kbd>Space</kbd> handbrake</div>
    <div><kbd>R</kbd> reset run &nbsp; <kbd>T</kbd> respawn car</div>
    <div><kbd>C</kbd> camera &nbsp; <kbd>B</kbd> beam view</div>
  </div>

  <div class="panel" id="speedo">
    <div><span class="val" id="mph">0</span><span class="unit">MPH</span></div>
    <div id="gear">ENGINE OK</div>
  </div>

  <div class="panel" id="status">
    <div class="row"><span>SURVIVED</span><b id="time">0.0s</b></div>
    <div class="row"><span>PURSUERS</span><b id="cops">0</b></div>
    <div class="row"><span>NEAREST</span><b id="near">—</b></div>
    <div class="row"><span>CHASSIS</span><b id="dmgpct">0%</b></div>
    <div class="bar"><i id="dmg"></i></div>
  </div>
</div>

<div id="flash"></div>

<div id="overlay">
  <h1 id="ovTitle">TOTALED</h1>
  <p id="ovSub">Chassis integrity lost.</p>
  <p id="ovScore"></p>
  <div class="hint">press <b>R</b> to run again</div>
</div>

<div id="boot">
  <h1>CRUMPLE</h1>
  <p>soft-body pursuit sandbox — every panel is simulated</p>
  <div class="go">click to start</div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
