<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Night Cruise — A jazz fusion music visualizer that reacts to Spotify in real-time. Watch a chill night drive scene groove to your music." />
  <title>Night Cruise — Jazz Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="scene-canvas"></canvas>

  <!-- Track Info HUD -->
  <div id="hud" class="hud hidden">
    <div class="hud-album-art">
      <img id="hud-art" src="" alt="Album art" />
    </div>
    <div class="hud-text">
      <div id="hud-track" class="hud-track">—</div>
      <div id="hud-artist" class="hud-artist">—</div>
    </div>
  </div>

  <!-- Audio Source Modal -->
  <div id="start-modal" class="modal">
    <div class="modal-content">
      <div class="modal-glow"></div>
      <h1 class="modal-title">Night Cruise</h1>
      <p class="modal-subtitle">Jazz Fusion Visualizer</p>
      
      <div class="modal-section">
        <button id="btn-spotify-login" class="btn btn-spotify">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
          Connect Spotify
        </button>
      </div>

      <div class="modal-divider">
        <span>then choose audio source</span>
      </div>
      
      <div class="modal-section audio-options">
        <button id="btn-system-audio" class="btn btn-audio" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="14" r="4"/><line x1="12" y1="6" x2="12" y2="6.01"/></svg>
          System Audio
          <span class="btn-hint">Best quality — shares a tab</span>
        </button>
        <button id="btn-mic-audio" class="btn btn-audio" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          Microphone
          <span class="btn-hint">Uses your mic to listen</span>
        </button>
      </div>

      <div id="modal-status" class="modal-status"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
