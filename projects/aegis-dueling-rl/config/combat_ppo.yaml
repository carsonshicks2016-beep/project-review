# Aegis — M2 trainer config: combat actions vs a TrainingDummy (single learning agent).
#   mlagents-learn config/combat_ppo.yaml --run-id=combat01 --time-scale=20 --no-graphics
# Discrete combat intent + continuous PD control. Once this lands hits reliably on the dummy,
# move to config/duel_ppo_selfplay.yaml (M3).

behaviors:
  Duelist:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 24576
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3            # a touch more entropy — discrete intent needs exploration
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 20
    checkpoint_interval: 500000
    max_steps: 50000000
    time_horizon: 1000
    summary_freq: 30000
