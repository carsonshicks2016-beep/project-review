# Aegis — tiny smoke config to validate the M1 training loop end-to-end (auto-exits ~12k steps).
# Not for real training (use balance_ppo.yaml for that). Behavior name MUST match the scene.
behaviors:
  Duelist:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 2048
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 12000
    time_horizon: 1000
    summary_freq: 2000
