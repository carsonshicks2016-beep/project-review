# Aegis — M1 balance training run (background). ~500k steps, frequent checkpoints.
behaviors:
  Duelist:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 6
    checkpoint_interval: 100000
    max_steps: 400000
    time_horizon: 1000
    summary_freq: 20000
