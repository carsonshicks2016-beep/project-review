# Aegis — starter ML-Agents trainer config (PPO + self-play)
# Use at M3 once two agents share the arena on TeamId 0 / 1.
# Run: mlagents-learn config/duel_ppo_selfplay.yaml --run-id=aegis_m3_001 --time-scale=20 --no-graphics
# Tune batch/buffer up for continuous motor control; watch ELO + reward in TensorBoard.

behaviors:
  Duelist:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3            # entropy — keep exploration alive in continuous control
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true         # important for raw physics observations
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995          # long horizon for motor control
        strength: 1.0
    keep_checkpoints: 20
    checkpoint_interval: 500000
    max_steps: 100000000
    time_horizon: 1000
    summary_freq: 50000

    # --- Self-play: ML-Agents snapshots opponents and tracks ELO automatically ---
    self_play:
      save_steps: 50000                  # how often to snapshot a new opponent
      team_change: 250000                # steps before the learning team swaps sides
      swap_steps: 50000                  # steps between opponent swaps
      window: 10                         # size of the past-opponent pool
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

