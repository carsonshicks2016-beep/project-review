[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "melee-lab"
version = "0.1.0"
description = "Local Melee reinforcement learning laboratory"
requires-python = ">=3.12,<3.14"
dependencies = ["melee==0.47.3", "stable-baselines3==2.9.0", "sb3-contrib==2.9.0", "gymnasium==1.3.0", "fastapi==0.141.1", "uvicorn==0.52.4"]
[project.scripts]
melee-lab = "melee_lab.cli:main"
[tool.setuptools.package-data]
melee_lab = ["web/*", "native/*.swift"]
[tool.setuptools.packages.find]
include = ["melee_lab*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
