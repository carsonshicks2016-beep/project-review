[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-mm"
version = "0.1.0"
description = "AegisMM: Adaptive Microstructure Liquidity Provision Engine"
authors = [{ name = "Carson Hicks" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "alpaca-py>=0.30.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "rich>=13.0.0",
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
