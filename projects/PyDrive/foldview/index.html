<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FOLDSPACE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div id="left">
        <div id="shape">—</div>
        <div id="shapesub">FOLD <span id="cidx">1</span> / <span id="ctot">1</span></div>
      </div>
      <div id="center"><div id="title">FOLDSPACE</div></div>
      <div id="right">
        <div id="scorebig">0%</div>
        <div id="scorelbl">SHAPE MATCH</div>
      </div>
    </header>

    <div id="stage"><canvas id="scene"></canvas></div>

    <footer id="controls">
      <button id="prev" title="Previous shape">◀◀</button>
      <button id="play" title="Play / pause">❚❚</button>
      <button id="next" title="Next shape">▶▶</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" />
      <button id="speed" title="Playback speed">1.0×</button>
      <button id="auto" class="active" title="Auto-cycle shapes">AUTO</button>
      <span class="pill" id="ghost">GHOST ON</span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
