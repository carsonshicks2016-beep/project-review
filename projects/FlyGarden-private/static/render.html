<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"/static/vendor/three.module.js"}}</script><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101c24;font-family:Arial,sans-serif;color:#e8eedf}canvas{width:100vw;height:100vh;display:block}.label{position:absolute;background:#101c24dd;padding:14px 20px;border:1px solid #64776255;border-radius:8px}.top{top:20px;left:20px;width:52%}.brain{top:20px;left:57%;right:20px}.bottom{bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;gap:20px;font-size:18px}.title{font-size:27px;font-weight:bold}.small{font-size:16px;line-height:1.5;color:#b1c4b2}.legend{height:8px;background:linear-gradient(90deg,#152939,#30bed4,#c5d929,#ff6236);margin:8px 0}
</style></head><body><canvas id="render-canvas"></canvas><div class="label top"><div class="title">Fly Garden · recorded trial</div><div class="small" id="identity"></div></div><div class="label brain"><div class="title">Individual neuron activity</div><div class="legend"></div><div class="small">0 → 500+ Hz · preceding 100 simulated ms</div><div class="small" id="coverage"></div><div class="small">Whole branches share one modeled neuron’s activity.</div></div><div class="label bottom"><span id="time"></span><span id="food"></span><span id="energy"></span><span id="outcome"></span><span id="learning"></span></div><script type="module">
import {RecordedView} from './recorded-view.js';
const data=await(await fetch('/render-input')).json(),view=new RecordedView(document.getElementById('render-canvas'),{interactive:false,camera:data.settings.camera});view.setGeometry(data.geometry);view.setArena(data.manifest.arena);view.setNeurons(data.neurons);if(data.settings.camera_view)view.restoreCamera(data.settings.camera_view);
document.getElementById('identity').textContent=`${data.manifest.controller?.name||data.manifest.mode} · seed ${data.manifest.seed} · ${data.manifest.id.slice(0,8)}${data.manifest.body_recorded===false?' · no physical body simulated':''}`;
window.renderRecordedFrame=({state,time,rates,nextState})=>{const visible=view.draw(state,time,rates,{},nextState);document.getElementById('coverage').textContent=data.manifest.individual_spikes?`${visible} visible skeletons / ${data.manifest.neurons?.toLocaleString()} modeled neurons · other spike events retained${time<data.start+.1?' · initial rate window partial':''}`:'Individual neuron activity was not recorded';document.getElementById('time').textContent=`${time.toFixed(3)} simulated seconds`;document.getElementById('food').textContent=`Food collected: ${state.world.collected??'—'}`;document.getElementById('energy').textContent=`Energy: ${state.world.energy?.toFixed(1)??'—'}% · game model`;document.getElementById('outcome').textContent=`Trial: ${state.world.status} · ${data.recording.status||'legacy recording'}`;document.getElementById('learning').textContent=`Plasticity ${state.learning?'enabled':'frozen / absent'} · learning unvalidated`;};window.renderReady=true;
</script></body></html>
