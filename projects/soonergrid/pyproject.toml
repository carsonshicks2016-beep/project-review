[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soonergrid"
version = "0.2.0"
description = "Reproducible exploratory traffic simulation and research workspace"
requires-python = ">=3.10"
dependencies = ["networkx>=3.4,<4", "requests>=2.32,<3"]

[project.scripts]
soonergrid = "soonergrid.__main__:main"

[tool.setuptools.packages.find]
include = ["soonergrid*"]
