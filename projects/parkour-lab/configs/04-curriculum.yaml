stage: 4
env_id: ParkourHumanoid
seed: 42
total_timesteps: 3000000
n_envs: 8
n_steps: 512
batch_size: 256
n_epochs: 5
learning_rate: 0.00003
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.002
max_grad_norm: 0.5
vf_coef: 0.5
net_arch:
- 256
- 256
activation: relu
ortho_init: false
log_std_init: -2.0
eval_every_updates: 25
eval_episodes: 5

curriculum:
  initial_level: 1.0
  max_level: 5.0
  advance_threshold: 0.60
  demote_threshold: 0.20
  replay_prob: 0.20
