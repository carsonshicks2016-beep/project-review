behaviors:
  RallyAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      memory:
        sequence_length: 16
        memory_size: 256
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000

environment_parameters:
  # Stage 1 (Fundamentals): Wide, straight tarmac tracks. Infinite grip. No damage.
  # Stage 2 (Cornering): Introduce tight curves and elevation changes.
  # Stage 3 (Generalization): Procedural generation enabled. Introduce gravel and snow biomes.
  # Stage 4 (Mastery): Enable Tire Wear, Asymmetric Damage, and Night Mode (LSTM reliance).
  
  track_complexity:
    curriculum:
      - name: Stage1_Fundamentals
        completion_criteria:
          measure: reward
          behavior: RallyAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.0
      - name: Stage2_Cornering
        completion_criteria:
          measure: reward
          behavior: RallyAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.4
      - name: Stage3_Generalization
        completion_criteria:
          measure: reward
          behavior: RallyAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.8
      - name: Stage4_Mastery
        value: 1.0

  damage_enabled:
    curriculum:
      - name: Stage1_Fundamentals
        completion_criteria:
          measure: reward
          behavior: RallyAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.0
      - name: Stage2_Cornering
        completion_criteria:
          measure: reward
          behavior: RallyAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.0
      - name: Stage3_Generalization
        completion_criteria:
          measure: reward
          behavior: RallyAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.0
      - name: Stage4_Mastery
        value: 1.0

  weather_mode:
    curriculum:
      - name: Stage1_Fundamentals
        completion_criteria:
          measure: reward
          behavior: RallyAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.0 # Clear
      - name: Stage2_Cornering
        completion_criteria:
          measure: reward
          behavior: RallyAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.0 # Clear
      - name: Stage3_Generalization
        completion_criteria:
          measure: reward
          behavior: RallyAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 1.0 # Rain/Snow mixed (will handle randomizing in C# via 1.0 threshold)
      - name: Stage4_Mastery
        value: 3.0 # Night mode enabled periodically
