<!DOCTYPE html>
<html>
<head>
<title>True 3D Hologram Telemetry</title>
<style>
  body {
    background-color: transparent;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: -apple-system, sans-serif;
  }
  .hologram-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    outline: none;
    /* Adding a CSS glow filter to the webgl canvas for extra hologram bloom */
    filter: drop-shadow(0 0 10px rgba(69, 182, 255, 0.4));
  }
  
  .ui-overlay {
    display: none;
    position: absolute;
    top: 15px;
    left: 20px;
    color: #45b6ff;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 5;
  }
  
  .ui-overlay-bottom {
    display: none;
    position: absolute;
    bottom: 15px;
    right: 20px;
    color: rgba(69, 182, 255, 0.6);
    font-size: 10px;
    font-family: monospace;
    z-index: 5;
    text-align: right;
  }
  
  /* Scanline effect */
  .scanlines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
    background-size: 100% 4px;
    opacity: 0.5;
    z-index: 10;
  }
</style>
</head>
<body>

<div class="hologram-container">
  <div class="ui-overlay">TELEMETRY_LINK_ACTIVE // MAZDA 787B 3D</div>
  <div class="ui-overlay-bottom">SYS_STATUS: NOMINAL<br>SPIN: <span id="yaw-disp">0</span>°</div>
  <canvas id="holo-canvas"></canvas>
  <div class="scanlines"></div>
</div>

<script type="module">
  import * as THREE from '/3d/static/vendor/three.module.min.js';
  import { GLTFLoader } from '/3d/static/vendor/GLTFLoader.js';

  const canvas = document.getElementById('holo-canvas');
  const yawDisp = document.getElementById('yaw-disp');
  
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  
  const scene = new THREE.Scene();
  // Optional subtle blue fog
  scene.fog = new THREE.FogExp2(0x090b0f, 0.05);
  
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
  camera.position.set(-3.5, 2.0, 4.0);
  camera.lookAt(0, 0.5, 0);

  function resize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // Hologram material
  // Edges/wireframe look really cool for holograms
  const holoMat = new THREE.MeshBasicMaterial({
    color: 0x45b6ff,
    wireframe: true,
    transparent: true,
    opacity: 0.15,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  
  const solidHoloMat = new THREE.MeshBasicMaterial({
    color: 0x114466,
    transparent: true,
    opacity: 0.4,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const pivot = new THREE.Group();
  scene.add(pivot);

  const loader = new GLTFLoader();
  loader.load('/static/787b/new_mazda787b.glb', (gltf) => {
    const model = gltf.scene;
    
    // Convert materials to hologram
    model.traverse((child) => {
      if (child.isMesh) {
        // We can duplicate the mesh to have both a solid core and a wireframe shell
        const wire = new THREE.Mesh(child.geometry, holoMat);
        const solid = new THREE.Mesh(child.geometry, solidHoloMat);
        wire.position.copy(child.position);
        wire.rotation.copy(child.rotation);
        wire.scale.copy(child.scale);
        
        solid.position.copy(child.position);
        solid.rotation.copy(child.rotation);
        solid.scale.copy(child.scale);
        
        pivot.add(wire);
        pivot.add(solid);
      }
    });
    
    // Scale and position adjustment if needed
    pivot.scale.set(0.8, 0.8, 0.8);
    pivot.position.y = -0.5; // center it visually
  }, undefined, (e) => console.error("Error loading GLB:", e));

  // Add a spinning grid underneath to sell the "holodeck" feel
  const grid = new THREE.GridHelper(10, 20, 0x45b6ff, 0x114466);
  grid.material.transparent = true;
  grid.material.opacity = 0.3;
  grid.position.y = -0.5;
  scene.add(grid);

  let yaw = 0;
  function animate() {
    requestAnimationFrame(animate);
    
    yaw += 0.005; // smooth rotation
    pivot.rotation.y = yaw;
    grid.rotation.y = yaw * 0.2; // slow spin on grid
    
    const deg = Math.floor((yaw * 180 / Math.PI)) % 360;
    yawDisp.innerText = deg.toString().padStart(3, '0');

    renderer.render(scene, camera);
  }
  
  animate();
</script>

</body>
</html>
