<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supra 3D Drive — V2</title>
  <link rel="stylesheet" href="/3d/static/style.css?v=v2-p7">
</head>
<body>
  <canvas id="scene"></canvas>

  <section class="hud top-left">
    <div class="eyebrow">3D Viewer · V2</div>
    <h1>Supra 3D Drive</h1>
    <div class="status-row">
      <span id="conn" class="pill warn">connecting</span>
      <span id="track-name" class="pill">club</span>
      <span id="camera-mode" class="pill">chase</span>
      <span id="fps" class="pill">— fps</span>
      <span id="air" class="pill air" style="display:none">AIR</span>
      <span id="brain" class="pill brain" style="display:none">🧠</span>
    </div>
  </section>

  <section class="hud controls">
    <label>
      Car
      <select id="car">
        <option value="supra" selected>Supra</option>
      </select>
    </label>
    <label>
      Track
      <select id="track">
        <option value="club" selected>club</option>
        <option value="national">national</option>
        <option value="coast">coast</option>
        <option value="sprint">sprint</option>
        <option value="tech">tech</option>
        <option value="akina">akina</option>
        <option value="pass">pass</option>
        <option value="ridge">ridge ⤴</option>
        <option value="oval2">oval2</option>
        <option value="speedbowl">speedbowl</option>
        <option value="random">random</option>
        <option value="touge">touge</option>
      </select>
    </label>
    <button id="daynight">☾ Night</button>
    <button id="restart">Restart</button>
  </section>

  <section class="hud dash">
    <div class="readout">
      <b id="speed">0</b>
      <span>km/h</span>
    </div>
    <div class="gauge">
      <div><span>RPM</span><b id="rpm">0</b></div>
      <div><span>GEAR</span><b id="gear">1</b></div>
      <div><span>LAP</span><b id="progress">0%</b></div>
    </div>
    <div class="bars">
      <div><span>Throttle</span><i><em id="throttle"></em></i></div>
      <div><span>Brake</span><i><em id="brake"></em></i></div>
      <div><span>Steer</span><i class="center"><em id="steer"></em></i></div>
    </div>
  </section>

  <section class="hud help">
    <b>WASD / Arrows</b> drive
    <b>Space</b> handbrake
    <b>R</b> reset
    <b>C</b> camera
    <b>T</b> auto/manual
    <b>Q/E</b> shift
    <b>L</b> day/night
  </section>

  <div id="toast" class="toast"></div>
  <script type="module" src="/3d/static/app.js?v=v2-p7"></script>
</body>
</html>
